# Secrets Template for Sentrix
#
# IMPORTANT:
# 1. Copy this file to secrets.yaml
# 2. Fill in the base64-encoded values
# 3. Apply: kubectl apply -f secrets.yaml
# 4. NEVER commit secrets.yaml to git
#
# To base64 encode a value:
#   echo -n "your-value" | base64
#
# To decode a value:
#   echo "base64-value" | base64 -d

---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: sentrix
type: Opaque
data:
  # Base64-encoded PostgreSQL credentials
  # Example: echo -n "sentrix_user" | base64
  username: REPLACE_WITH_BASE64_USERNAME
  # Example: echo -n "your-strong-password" | base64
  password: REPLACE_WITH_BASE64_PASSWORD

---
apiVersion: v1
kind: Secret
metadata:
  name: django-secret
  namespace: sentrix
type: Opaque
data:
  # Base64-encoded Django secret key
  # Generate: python -c "from django.core.management.utils import get_random_secret_key; print(get_random_secret_key())" | base64
  secret-key: REPLACE_WITH_BASE64_DJANGO_SECRET_KEY

---
apiVersion: v1
kind: Secret
metadata:
  name: jwt-secret
  namespace: sentrix
type: Opaque
data:
  # Base64-encoded JWT secret
  # Generate: openssl rand -base64 32 | base64
  secret: REPLACE_WITH_BASE64_JWT_SECRET

---
