apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-rules
  namespace: sentrix
  labels:
    app: prometheus
data:
  sentrix-alerts.yml: |
    groups:
      - name: sentrix_api_alerts
        interval: 30s
        rules:
          # High error rate alert
          - alert: HighAPIErrorRate
            expr: |
              (
                sum(rate(http_requests_total{status=~"5.."}[5m])) by (app)
                /
                sum(rate(http_requests_total[5m])) by (app)
              ) > 0.05
            for: 5m
            labels:
              severity: warning
              component: api
            annotations:
              summary: "High API error rate on {{ $labels.app }}"
              description: "{{ $labels.app }} has {{ $value | humanizePercentage }} error rate (> 5%)"

          # API latency alert
          - alert: HighAPILatency
            expr: |
              histogram_quantile(0.95,
                sum(rate(http_request_duration_seconds_bucket[5m])) by (le, app)
              ) > 1.0
            for: 5m
            labels:
              severity: warning
              component: api
            annotations:
              summary: "High API latency on {{ $labels.app }}"
              description: "{{ $labels.app }} P95 latency is {{ $value }}s (> 1s)"

          # Decision API latency alert (more strict)
          - alert: HighDecisionAPILatency
            expr: |
              histogram_quantile(0.95,
                sum(rate(http_request_duration_seconds_bucket{endpoint="/v1/edge/decision/"}[5m])) by (le)
              ) > 0.025
            for: 5m
            labels:
              severity: critical
              component: edge
            annotations:
              summary: "High decision API latency"
              description: "Decision API P95 latency is {{ $value }}s (> 25ms)"

          # Pod down alert
          - alert: PodDown
            expr: up{namespace="sentrix"} == 0
            for: 2m
            labels:
              severity: critical
              component: infrastructure
            annotations:
              summary: "Pod {{ $labels.pod }} is down"
              description: "{{ $labels.pod }} in namespace {{ $labels.namespace }} has been down for 2 minutes"

          # High CPU usage
          - alert: HighCPUUsage
            expr: |
              (
                sum(rate(container_cpu_usage_seconds_total{namespace="sentrix"}[5m])) by (pod)
                /
                sum(container_spec_cpu_quota{namespace="sentrix"}/container_spec_cpu_period{namespace="sentrix"}) by (pod)
              ) > 0.9
            for: 10m
            labels:
              severity: warning
              component: infrastructure
            annotations:
              summary: "High CPU usage on {{ $labels.pod }}"
              description: "{{ $labels.pod }} CPU usage is {{ $value | humanizePercentage }} (> 90%)"

          # High memory usage
          - alert: HighMemoryUsage
            expr: |
              (
                sum(container_memory_working_set_bytes{namespace="sentrix"}) by (pod)
                /
                sum(container_spec_memory_limit_bytes{namespace="sentrix"}) by (pod)
              ) > 0.9
            for: 10m
            labels:
              severity: warning
              component: infrastructure
            annotations:
              summary: "High memory usage on {{ $labels.pod }}"
              description: "{{ $labels.pod }} memory usage is {{ $value | humanizePercentage }} (> 90%)"

          # PostgreSQL down
          - alert: PostgreSQLDown
            expr: pg_up{namespace="sentrix"} == 0
            for: 1m
            labels:
              severity: critical
              component: database
            annotations:
              summary: "PostgreSQL is down"
              description: "PostgreSQL database has been down for 1 minute"

          # Redis down
          - alert: RedisDown
            expr: redis_up{namespace="sentrix"} == 0
            for: 1m
            labels:
              severity: critical
              component: cache
            annotations:
              summary: "Redis is down"
              description: "Redis cache has been down for 1 minute"

          # Kafka consumer lag alert
          - alert: HighKafkaConsumerLag
            expr: kafka_consumer_lag{namespace="sentrix"} > 10000
            for: 5m
            labels:
              severity: warning
              component: kafka
            annotations:
              summary: "High Kafka consumer lag on {{ $labels.consumer_group }}"
              description: "Consumer {{ $labels.consumer_group }} has lag of {{ $value }} messages"

          # Kafka consumer lag critical
          - alert: CriticalKafkaConsumerLag
            expr: kafka_consumer_lag{namespace="sentrix"} > 50000
            for: 10m
            labels:
              severity: critical
              component: kafka
            annotations:
              summary: "Critical Kafka consumer lag on {{ $labels.consumer_group }}"
              description: "Consumer {{ $labels.consumer_group }} has lag of {{ $value }} messages (> 50k)"

          # Detection rate anomaly
          - alert: HighDetectionRate
            expr: |
              sum(rate(detection_events_total[5m])) by (detector_type)
              > 10
            for: 15m
            labels:
              severity: warning
              component: detection
            annotations:
              summary: "High detection rate for {{ $labels.detector_type }}"
              description: "{{ $labels.detector_type }} is triggering {{ $value }} detections/sec"

          # Policy evaluation failures
          - alert: PolicyEvaluationFailures
            expr: |
              sum(rate(policy_evaluation_errors_total[5m])) > 1
            for: 5m
            labels:
              severity: warning
              component: policy
            annotations:
              summary: "Policy evaluation failures"
              description: "{{ $value }} policy evaluation errors per second"

          # Disk space warning
          - alert: LowDiskSpace
            expr: |
              (
                node_filesystem_avail_bytes{namespace="sentrix",mountpoint="/"}
                /
                node_filesystem_size_bytes{namespace="sentrix",mountpoint="/"}
              ) < 0.15
            for: 5m
            labels:
              severity: warning
              component: infrastructure
            annotations:
              summary: "Low disk space on {{ $labels.instance }}"
              description: "Disk space is {{ $value | humanizePercentage }} available (< 15%)"

          # Model server inference failures
          - alert: ModelServerInferenceFailures
            expr: |
              (
                sum(rate(model_inference_errors_total[5m]))
                /
                sum(rate(model_inference_requests_total[5m]))
              ) > 0.1
            for: 5m
            labels:
              severity: warning
              component: ml
            annotations:
              summary: "High model server inference failure rate"
              description: "Model server has {{ $value | humanizePercentage }} failure rate (> 10%)"

          # Model server latency
          - alert: HighModelServerLatency
            expr: |
              histogram_quantile(0.95,
                sum(rate(model_inference_duration_seconds_bucket[5m])) by (le)
              ) > 1.0
            for: 5m
            labels:
              severity: warning
              component: ml
            annotations:
              summary: "High model server latency"
              description: "Model server P95 latency is {{ $value }}s (> 1s)"
