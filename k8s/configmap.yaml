apiVersion: v1
kind: ConfigMap
metadata:
  name: sentrix-config
  namespace: sentrix
data:
  # Django settings
  DJANGO_SETTINGS_MODULE: "sentrix.settings"
  DJANGO_DEBUG: "False"
  DJANGO_ALLOWED_HOSTS: "api.yourdomain.com,sentrix.yourdomain.com,*"

  # Database
  DB_HOST: "postgresql"
  DB_PORT: "5432"
  DB_NAME: "sentrix"

  # Redis
  REDIS_URL: "redis://redis:6379/0"

  # Kafka
  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  KAFKA_TOPIC_INGEST: "ingest.events"
  KAFKA_TOPIC_ENRICHED: "enriched.events"
  KAFKA_TOPIC_DETECTION: "detection.events"
  KAFKA_TOPIC_POLICY: "policy.updates"

  # Model Server
  R1_MODEL_SERVER_URL: "http://model-server:8001"

  # Feature flags
  ENABLE_R1_REALTIME: "true"
  ENABLE_R1_BATCH: "false"

  # Performance
  GUNICORN_WORKERS: "4"
  GUNICORN_THREADS: "2"
  GUNICORN_TIMEOUT: "30"

  # Monitoring
  PROMETHEUS_MULTIPROC_DIR: "/tmp/prometheus"

  # Logging
  LOG_LEVEL: "INFO"
  LOG_FORMAT: "json"
