# Redis Configuration for High-Load SENTRIX
# Optimized for async Edge with 10,000+ concurrent connections

# ======================
# NETWORK
# ======================
maxclients 20000                        # Max concurrent clients (Edge + Backend + Buffer)
tcp-backlog 511                         # TCP listen() backlog
timeout 0                               # No timeout for idle clients

# ======================
# MEMORY
# ======================
maxmemory 8gb                           # Use 8GB of 24GB RAM for Redis
maxmemory-policy allkeys-lru            # Evict least recently used keys when full

# ======================
# PERSISTENCE
# ======================
appendonly yes                          # AOF persistence (crash-safe)
appendfsync everysec                    # Fsync every second (good balance)
no-appendfsync-on-rewrite yes           # Don't fsync during rewrite

# Save snapshots periodically
save 900 1                              # Save if 1 key changed in 15 minutes
save 300 10                             # Save if 10 keys changed in 5 minutes
save 60 10000                           # Save if 10k keys changed in 1 minute

# ======================
# PERFORMANCE
# ======================
hz 10                                   # Internal scheduler frequency
lazyfree-lazy-eviction yes             # Async eviction for performance
lazyfree-lazy-expire yes               # Async expiration
lazyfree-lazy-server-del yes           # Async DEL operations

# ======================
# SECURITY
# ======================
requirepass sentrix_redis_pass          # Password authentication

# ======================
# LOGGING
# ======================
loglevel notice                         # Moderate verbosity

