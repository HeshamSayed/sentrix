version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: sentrix-postgres
    environment:
      POSTGRES_DB: sentrix
      POSTGRES_USER: sentrix
      POSTGRES_PASSWORD: sentrix
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentrix"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: sentrix-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Zookeeper (required for Kafka)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: sentrix-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  # Kafka Broker
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: sentrix-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5

  # Kafka Schema Registry (optional but recommended)
  schema-registry:
    image: confluentinc/cp-schema-registry:7.5.0
    container_name: sentrix-schema-registry
    depends_on:
      - kafka
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081

  # Model Server (Deepseek-R1 stub for development)
  model-server:
    build:
      context: ./model_server
      dockerfile: Dockerfile
    container_name: sentrix-model-server
    ports:
      - "8001:8001"
    environment:
      - MODEL_NAME=deepseek-r1-stub
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Django Control Plane (ASGI)
  control-plane:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sentrix-control-plane
    command: uvicorn sentrix.asgi:application --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=sentrix
      - POSTGRES_USER=sentrix
      - POSTGRES_PASSWORD=sentrix
      - REDIS_HOST=redis
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - R1_MODEL_SERVER_URL=http://model-server:8001
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      model-server:
        condition: service_healthy
    volumes:
      - ./backend:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Enrichment Consumer
  enrichment-consumer:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sentrix-enrichment-consumer
    command: python manage.py run_enrichment_consumer
    environment:
      - DEBUG=True
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=sentrix
      - POSTGRES_USER=sentrix
      - POSTGRES_PASSWORD=sentrix
      - REDIS_HOST=redis
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    depends_on:
      - postgres
      - kafka
      - control-plane
    volumes:
      - ./backend:/app
    restart: unless-stopped

  # Detector Consumer (Threat Detection Pipeline)
  detector-consumer:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sentrix-detector-consumer
    command: python manage.py run_detector_consumer
    environment:
      - DEBUG=True
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=sentrix
      - POSTGRES_USER=sentrix
      - POSTGRES_PASSWORD=sentrix
      - REDIS_HOST=redis
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - R1_MODEL_SERVER_URL=http://model-server:8001
    depends_on:
      - postgres
      - kafka
      - model-server
      - control-plane
      - enrichment-consumer
    volumes:
      - ./backend:/app
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: sentrix-network
