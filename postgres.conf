# PostgreSQL Configuration for High-Load SENTRIX
# Optimized for 8 vCPU, 24GB RAM server with 10,000+ req/s

# ======================
# CONNECTIONS
# ======================
max_connections = 500                    # Increased from default 100
                                        # Edge (8 workers × 50) + Backend (4 workers × 50) + Buffer

# ======================
# MEMORY
# ======================
shared_buffers = 6GB                    # 25% of total RAM (24GB)
effective_cache_size = 18GB             # 75% of total RAM
work_mem = 64MB                         # Per operation (sort, hash join)
maintenance_work_mem = 1GB              # For VACUUM, CREATE INDEX

# ======================
# QUERY PLANNER
# ======================
random_page_cost = 1.1                  # SSD/NVMe optimization (default 4.0)
effective_io_concurrency = 200          # NVMe can handle high concurrent I/O

# ======================
# WRITE AHEAD LOG (WAL)
# ======================
wal_buffers = 16MB
min_wal_size = 1GB
max_wal_size = 4GB
checkpoint_completion_target = 0.9      # Spread checkpoints for smooth I/O

# ======================
# PERFORMANCE
# ======================
default_statistics_target = 100         # Better query planning (default 100)

